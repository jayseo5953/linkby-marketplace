services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - storage-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the bucket once storage is healthy, then exits 0 (T-20).
  # `Exited (0)` in `docker compose ps` is success, not a crash.
  storage-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      storage:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: >
      sh -c "mc alias set local http://storage:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY &&
             mc mb --ignore-existing local/$$S3_BUCKET &&
             echo bucket $$S3_BUCKET ready"

  # Applies pending Drizzle migrations once the db is healthy, then exits 0.
  # Shares the `api` image tag so Compose builds it once instead of twice.
  # apps/api is mounted because the migration .sql files are generated on the
  # host after the image is built, so the baked-in copy would be stale.
  migrate:
    image: linkby-marketplace-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: npm run db:migrate
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - ./apps/api:/app/apps/api
      # The schema imports the shared enums, so a stale baked-in copy would migrate to
      # the wrong values.
      - ./packages/shared:/app/packages/shared
    depends_on:
      db:
        condition: service_healthy

  # Loads the demo dataset once the tables and the bucket both exist, then exits 0.
  # `Exited (0)` in `docker compose ps` is success, not a crash.
  # Seeding is idempotent — it guards on existing users and exits 0 without
  # re-inserting — so it is safe that Compose runs it on every `up`.
  # Writes rows to Postgres and uploads images to MinIO, hence both sets of vars.
  seed:
    image: linkby-marketplace-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: npm run db:seed
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # The seed signs no tokens. It needs this because config.ts validates the whole environment
      # the moment it is imported, and every service running app code goes through it.
      JWT_SECRET: ${JWT_SECRET}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages/shared:/app/packages/shared
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully

  api:
    image: linkby-marketplace-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      API_PORT: 3000
      # Derived, so the credentials exist in exactly one place.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CORS_ORIGIN: ${CORS_ORIGIN}
      JWT_SECRET: ${JWT_SECRET}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports:
      - '3000:3000'
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages/shared:/app/packages/shared
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_URL: ${VITE_API_URL}
    ports:
      - '5173:5173'
    volumes:
      # Whole directories, never single files — editors replace a file's inode on save
      # and a single-file bind mount keeps pointing at the old one.
      - ./apps/web:/app/apps/web
      - ./packages/shared:/app/packages/shared
    depends_on:
      - api

volumes:
  db-data:
  storage-data:
